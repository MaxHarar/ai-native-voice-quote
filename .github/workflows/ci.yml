name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p .
      - name: Unit, contract and integration tests (coverage gate in bunfig.toml)
        run: bun test --coverage
      - name: Black-box smoke against a real booted server
        run: bun scripts/smoke.ts
      - name: Dependency audit
        run: bun audit
      - name: Scan tracked files for secrets and phone numbers
        run: |
          set -euo pipefail
          # E.164 US numbers and common credential shapes must never be committed.
          if git grep -nE '\+1[0-9]{10}|sk_[A-Za-z0-9]{20,}|AC[0-9a-f]{32}|SK[0-9a-f]{32}|xi-api-key: [A-Za-z0-9]{20,}' -- . ':!*.lock' ':!.env.example' ':!test/**'; then
            echo "Possible secret or phone number in tracked files" && exit 1
          fi
